<!DOCTYPE html>
<html>
<head>
    <title>Clear Auth Data</title>
</head>
<body>
    <h1>Clear Authentication Data</h1>
    <button onclick="clearAuth()">Clear All Auth Data</button>
    <div id="result"></div>
    
    <script>
        function clearAuth() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            document.getElementById('result').innerHTML = 
                '<p style="color: green;">✅ Auth data cleared! Please re-login at <a href="/login">/login</a></p>';
        }
    </script>
</body>
</html>
